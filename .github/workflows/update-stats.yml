name: Update XNU Stats
on:
  schedule:
    - cron: '*/10 * * * *' # Her 10 dakikada bir çalışır
  workflow_dispatch: # Manuel tetikleme için

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Fetch Repo Stats
        run: |
          # GitHub API'den verileri çekiyoruz
          REPO="Stux6-Technology/XNU-Development-Project"
          STATS=$(curl -s "https://api.github.com/repos/$REPO")
          COMMITS=$(curl -s "https://api.github.com/repos/$REPO/commits?per_page=1" -I | grep -i "link:" | sed -n 's/.*page=\([0-9]*\). text\/html.*/\1/p')
          
          # Senin o meşhur 31M+ satır verisini çekmek için Contributors API
          # Not: Bu kısım API'den dönen "additions" bilgisini toplar
          LINES=$(curl -s "https://api.github.com/repos/$REPO/stats/contributors" | jq '[.[] | .weeks | .[] | .a] | add')

          # Tabloyu oluşturuyoruz
          CONTENT="#### 🚀 XNU-Development-Project Live Stats\n"
          CONTENT="$CONTENT- **Total Lines of Code:** $LINES +\n"
          CONTENT="$CONTENT- **Total Commits:** $COMMITS\n"
          CONTENT="$CONTENT- **Last Update:** $(date -u +'%Y-%m-%d %H:%M:%S') UTC\n"
          CONTENT="$CONTENT\n> *This is not a game, this is kernel development.*"

          # README'yi güncelle
          sed -i "//,//c\\n$CONTENT\n" README.md

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "System: Update XNU Stats [skip ci]" || exit 0
          git push
